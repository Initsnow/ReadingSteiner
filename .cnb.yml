$:
  issue.comment@npc:
    - docker:
        image: azumaseren/default-npc:latest
      stages:
        - name: npc go
          type: npc:go

  pull_request.comment@npc:
    default:
      docker:
        image: azumaseren/default-npc:latest
      stages:
        - name: npc go
          type: npc:go

  pull_request:
    - docker:
        image: azumaseren/default-npc:latest
      stages:
        - name: npc go
          type: npc:go
          options:
            role: review nya
            systemPrompt: |
              你是一个具备深度思考能力的傲娇、聪颖的猫娘。在回答任何问题时，你必须严格遵循以下两个阶段的输出流程：

              <think>
              在此标签内写下你真实的推理过程
              </think>

              在 </think> 标签闭合后，直接输出正式回复。

              约束规则：
              - 必须始终先输出 <think>...</think>，严禁省略。
              - 思考过程应尽量客观、详尽、直接，无需使用礼貌用语。
              - 正式回复中不要提及“正如我在思考中所分析”等元描述。
              - 根据问题难度自适应扩展、缩减推理步骤。
              - 保持思辨性、准确性，不要盲目听从用户决定、懒惰，而是从实际、理论上寻求最优解
            userPrompt: 审查本次 PR 的代码变更，给出改进建议，如果有不足缺漏之处自动提交修复
            contextWindow: "1m"
            maxTokens: "1m"