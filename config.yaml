state_dir: state
media_dir: state/media
daemon:
  log_level: info
  concurrency: 16
  queue_capacity: 1024
  default_timeout_secs: 30
  default_cron: 0 * * * *
  default_user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36 Edg/151.0.0.0
  history_limit_per_source: 0
  failure_notify_threshold: 0
  timezone: Asia/Shanghai
web:
  listen: 127.0.0.1:8901
  static_dir: web/dist
telegram:
  url: ''
  api_base: https://api.telegram.org
  max_images_per_event: 10
  image_bytes_budget: 10485760
  digest_window_secs: 30
  template: ''
browser:
  enabled: false
  cdp_url: http://127.0.0.1:9222
  timeout_secs: 30
