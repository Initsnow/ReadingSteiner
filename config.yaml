state_dir: state
media_dir: state/media

daemon:
  socket_path: state/daemon.sock
  concurrency: 16
  queue_capacity: 1024
  log_level: info
  # 全局默认请求超时秒数（单个监控源可覆盖）
  default_timeout_secs: 30
  # 默认 User-Agent（HTTP 抓取与图片下载）
  default_user_agent: ""
  # 每个监控源最多保留的历史变更事件条数（0 不限制）
  history_limit_per_source: 0
  # 连续失败达到多少次后发送 Telegram 失败通知（0 禁用）
  failure_notify_threshold: 0
  # 监控检查调度器/告警展示使用的时区（IANA 名称，如 Asia/Shanghai；留空使用系统本地时区）
  timezone: ""
  # 全局默认检查间隔秒数（源未单独覆盖时使用，默认 3600 = 1h）
  interval_secs: 3600
  # 全局默认检查间隔随机抖动秒数（源未单独覆盖时使用，默认 60s）
  jitter_secs: 60

web:
  listen: 127.0.0.1:8901
  static_dir: web/dist

telegram:
  # token: "123456:ABC"       # prefer token_file for production
  token_file: state/telegram_token
  default_chat_id: ""
  api_base: https://api.telegram.org
  max_images_per_event: 10
  image_bytes_budget: 10485760
  digest_window_secs: 30
  # 变更通知模板（占位符：{label} {watch} {time} {tz} {summary} {items}；留空用默认）
  # template: ""
  template: ""

camofox:
  enabled: false
  base_url: http://127.0.0.1:9377
  access_key_file: state/camofox_access_key
  api_key_file: state/camofox_api_key
  user_id: readingsteiner
  session_key: readingsteiner
  health_check_interval_secs: 30
  pool_size: 4
