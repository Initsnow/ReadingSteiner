state_dir: state
media_dir: state/media

daemon:
  socket_path: state/daemon.sock
  concurrency: 16
  queue_capacity: 1024
  log_level: info

telegram:
  # token: "123456:ABC"       # prefer token_file for production
  token_file: state/telegram_token
  default_chat_id: ""
  api_base: https://api.telegram.org
  max_images_per_event: 10
  image_bytes_budget: 10485760
  digest_window_secs: 30

camofox:
  enabled: false
  base_url: http://127.0.0.1:9377
  access_key_file: state/camofox_access_key
  api_key_file: state/camofox_api_key
  user_id: readingsteiner
  session_key: readingsteiner
  health_check_interval_secs: 30
  pool_size: 4

pipelines:
  default:
    extract:
      - type: auto_text
    normalize: []
    filter:
      min_items: 0

  product_list:
    extract:
      - type: css_items
        selector: ".product"
        fields:
          id:
            attr: data-id
          title:
            selector: ".title"
          price:
            selector: ".price"
          image:
            attr: src
          link:
            attr: href
    normalize:
      - type: trim
        field: title
      - type: strip
        field: price
        chars: "¥$, "
      - type: abs_url
        field: image
        base: "{{final_url}}"
      - type: abs_url
        field: link
        base: "{{final_url}}"
    filter:
      include:
        - op: gt
          field: price
          value: 0
      drop_duplicate:
        key: "{{id}}|{{title}}|{{price}}"
      min_items: 1

sources:
  - id: example-page
    name: Example Page
    enabled: true
    tags: [demo]
    fetch:
      engine: http
      url: https://example.com
      max_body_bytes: 5242880
      timeout_secs: 30
    schedule:
      interval_secs: 60
      jitter_secs: 5
    priority: 0
    pipeline: default
    compare:
      mode: item_set
      stable_id: id
      notify_on: [new, updated, removed]
      confirm_count: 1
      cooldown_secs: 0
